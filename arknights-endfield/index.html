<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>【基本プレイ無料】アークナイツ：エンドフィールド｜今すぐプレイ — Arknights: Endfield</title>
  <meta name="description" content="アークナイツ：エンドフィールド — 惑星タロⅡを舞台にしたリアルタイム3D戦略RPG。今すぐ無料でプレイ！ Arknights: Endfield — play free now.">
  <meta name="theme-color" content="#f4efe3">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&family=Shippori+Mincho+B1:wght@800&display=swap">
  <link rel="preload" as="image" href="cover.jpg">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">
    <!-- Blurred copy of the art fills the empty space around the artwork -->
    <div class="backdrop" aria-hidden="true"></div>

    <!-- Key art -->
    <section class="frame" aria-label="アークナイツ：エンドフィールド / Arknights: Endfield">
      <img class="art" src="cover.jpg" alt="アークナイツ：エンドフィールド — エンドフィールドを探索 / Explore the Endfield" id="art">

      <!-- Main CTA, placed on the artwork's banner (landscape screens) -->
      <a class="cta cta--art js-cta" href="#" data-source="art">
        <span class="cta__shine" aria-hidden="true"></span>
        <span class="cta__badge" aria-hidden="true">無料</span>
        <span class="cta__ja">今すぐ無料でプレイ</span>
        <span class="cta__en" lang="en">PLAY FREE NOW</span>
        <span class="cta__arrow" aria-hidden="true">▶</span>
      </a>
    </section>

    <!-- Bottom panel (portrait / mobile screens) -->
    <section class="panel" aria-label="今すぐプレイ / Play now">
      <p class="panel__title">
        <span class="panel__ja">エンドフィールドを探索</span>
        <span class="panel__en" lang="en">EXPLORE THE ENDFIELD</span>
      </p>
      <p class="bubble">＼ ダウンロードは<strong>無料</strong>！ <span lang="en">Free to play!</span> ／</p>
      <a class="cta cta--panel js-cta" href="#" data-source="panel">
        <span class="cta__shine" aria-hidden="true"></span>
        <span class="cta__badge" aria-hidden="true">無料</span>
        <span class="cta__ja">今すぐ無料でプレイ</span>
        <span class="cta__en" lang="en">PLAY FREE NOW</span>
        <span class="cta__arrow" aria-hidden="true">▶</span>
      </a>
      <p class="panel__platforms">PC / PS5 / iOS / Android</p>
    </section>

    <!-- Mini video player (picture-in-picture style) -->
    <aside class="player" id="player" aria-label="PV / Trailer">
      <div class="player__screen">
        <video class="player__video" id="video" src="video.mp4" poster="cover.jpg" playsinline muted loop autoplay preload="auto"></video>
        <span class="player__tag">PV</span>
        <button class="player__center" id="btnCenter" type="button" aria-label="再生 / Play">
          <span class="icon-play" aria-hidden="true"></span>
        </button>
      </div>

      <div class="player__bar">
        <button class="player__btn" id="btnPlay" type="button" aria-label="一時停止 / Pause" title="再生・停止 / Play・Pause">
          <span class="icon-pause" aria-hidden="true"></span>
        </button>

        <button class="player__btn" id="btnMute" type="button" aria-label="音声オン / Unmute" title="ミュート / Mute">🔇</button>
        <input class="player__volume" id="volume" type="range" min="0" max="1" step="0.05" value="0.8" aria-label="音量 / Volume">

        <button class="player__btn player__btn--expand" id="btnExpand" type="button" aria-label="拡大 / Enlarge" title="拡大 / Enlarge">
          <span class="icon-expand" aria-hidden="true"></span>
        </button>
      </div>

      <div class="player__progress" aria-hidden="true"><div class="player__progress-bar" id="progressBar"></div></div>
    </aside>

    <!-- Dim layer behind the enlarged player -->
    <div class="player-shade" id="playerShade" aria-hidden="true"></div>
  </main>

  <script src="main.js"></script>
</body>
</html>
